name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - '.github/workflows/android-build.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      server_url:
        description: 'URL do servidor Next.js para o app carregar (ex: http://192.168.10.15:3010 ou https://aprimore.exemplo.com)'
        required: false
        default: ''

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências npm
        run: npm install --legacy-peer-deps

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Aceitar licenças do Android SDK
        run: yes | sdkmanager --licenses || true

      - name: Sincronizar Capacitor Android
        run: |
          if [ -n "${{ inputs.server_url }}" ]; then
            echo "Aplicando CAPACITOR_SERVER_URL=${{ inputs.server_url }}"
            export CAPACITOR_SERVER_URL="${{ inputs.server_url }}"
          fi
          npx cap sync android

      - name: Permissão de execução no gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK (assembleDebug)
        run: |
          cd android
          ./gradlew assembleDebug -PversionCode=${{ github.run_number }} -PversionName="1.0.${{ github.run_number }}" --no-daemon --stacktrace > ../gradle_build.log 2>&1 || {
            echo "=== BUILD FAILED ==="
            tail -n 120 ../gradle_build.log
            curl -f -X POST \
              "https://fbctoskurwbdlqwrdbqg.supabase.co/storage/v1/object/relatorios-fotograficos/apk/build_error.log" \
              -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZiY3Rvc2t1cndiZGxxd3JkYnFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MDc4OTgsImV4cCI6MjA5NTk4Mzg5OH0.-NmFngDLeRnJw2xRCkxNUEN2OsUkNg8XbMkfgsq8uiE" \
              -H "Content-Type: text/plain" \
              -H "x-upsert: true" \
              --data-binary "@../gradle_build.log" || true
            exit 1
          }

      - name: Renomear APK para distribuição
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/aprimore-erp.apk

      - name: Gerar metadados de versão (version.json)
        run: |
          cat << EOF > version.json
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "1.0.${{ github.run_number }}",
            "apkUrl": "https://fbctoskurwbdlqwrdbqg.supabase.co/storage/v1/object/public/relatorios-fotograficos/apk/aprimore-erp.apk",
            "notes": "Atualizações nativas, melhorias na galeria de fotos e estabilidade do app.",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload como Artifact do Workflow
        uses: actions/upload-artifact@v4
        with:
          name: aprimore-erp-apk
          path: android/app/build/outputs/apk/debug/aprimore-erp.apk
          if-no-files-found: error

      - name: Upload do APK e version.json para Supabase Storage
        run: |
          curl -f -X POST \
            "https://fbctoskurwbdlqwrdbqg.supabase.co/storage/v1/object/relatorios-fotograficos/apk/aprimore-erp.apk" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZiY3Rvc2t1cndiZGxxd3JkYnFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MDc4OTgsImV4cCI6MjA5NTk4Mzg5OH0.-NmFngDLeRnJw2xRCkxNUEN2OsUkNg8XbMkfgsq8uiE" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary "@android/app/build/outputs/apk/debug/aprimore-erp.apk"
          
          curl -f -X POST \
            "https://fbctoskurwbdlqwrdbqg.supabase.co/storage/v1/object/relatorios-fotograficos/apk/version.json" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZiY3Rvc2t1cndiZGxxd3JkYnFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MDc4OTgsImV4cCI6MjA5NTk4Mzg5OH0.-NmFngDLeRnJw2xRCkxNUEN2OsUkNg8XbMkfgsq8uiE" \
            -H "Content-Type: application/json" \
            -H "x-upsert: true" \
            --data-binary "@version.json"
        continue-on-error: true

      - name: Publicar Release no GitHub com o APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Aprimore ERP — Android APK
          body: |
            ### Aprimore ERP (Android APK)
            - **Download direto**: baixe `aprimore-erp.apk` abaixo.
            - Compilação automática gerada pelo GitHub Actions.
          files: |
            android/app/build/outputs/apk/debug/aprimore-erp.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
